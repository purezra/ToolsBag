[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
default-run = "app"
edition = "2021"
rust-version = "1.60"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.8.1", features = [ "dialog-save", "fs-read-file", "fs-read-dir", "fs-exists", "fs-rename-file", "dialog-open", "clipboard-all"] }
rayon = "1.10"
walkdir = "2.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "tiff", "webp"] }
tiff = "0.9"
exif = { package = "kamadak-exif", version = "0.6.1" }
flate2 = "1.0"
lru = "0.12"
once_cell = "1.19"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
infer = "0.13"
lopdf = "0.27"
printpdf = "0.7"
jpeg-decoder = "0.3"
argon2 = "0.5"
aes-gcm = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
rand = "0.7"
base64 = "0.21"
ed25519-dalek = { version = "1", features = ["rand"] }
zeroize = "1.6"
bincode = "1.3"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
# WebDAV sync dependencies
reqwest = { version = "0.11", features = ["json", "blocking"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
parking_lot = "0.12"
# MediaInfo dynamic loading
libloading = "0.8"
log = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
