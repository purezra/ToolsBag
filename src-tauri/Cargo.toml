[package]
name = "app"
version = "0.2.0"
description = "ToolsBag - A refined desktop toolbox"
authors = ["you"]
license = ""
repository = ""
default-run = "app"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

# Keep existing dependencies
rayon = "1.10"
walkdir = "2.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "tiff", "webp", "tga", "dds", "pnm", "ff", "hdr", "qoi", "avif"] }
tiff = "0.9"
exif = { package = "kamadak-exif", version = "0.6.1" }
flate2 = "1.0"
lru = "0.12"
once_cell = "1.19"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
infer = "0.13"
lopdf = "0.27"
printpdf = "0.7"
# JPEG XL 编码：纯 Rust，VarDCT(有损)+Modular(无损) 双模。许可证 AGPL-3.0 OR 商业（项目开源，AGPL 可接受）。
# 启用 parallel feature 以支持单图内多线程编码（与外层 rayon 池协作）。
jxl-encoder = { version = "0.3.1", features = ["parallel"] }
jpeg-decoder = "0.3"
# AVIF 编码：直接使用 ravif 以支持独立色彩/Alpha 质量（image::AvifEncoder 不支持分离 alpha quality）。
# 关闭默认 asm feature 以避免对 NASM 汇编器的依赖（保持纯 Rust 构建）。
ravif = { version = "0.12", default-features = false, features = ["threading"] }
imgref = "1.12"
rgb = "0.8"
argon2 = "0.5"
aes-gcm = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
zeroize = "1.6"
bincode = "1.3"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
parking_lot = "0.12"
libloading = "0.8"
log = "0.4"

[profile.release]
strip = true
lto = true
# 速度优先：编码热路径对优化级别敏感，opt-level=3 比 "z" 显著提速，代价是二进制变大。
opt-level = 3
panic = "abort"
